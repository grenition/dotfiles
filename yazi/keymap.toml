[mgr]
prepend_keymap = [
	{ on = "J", run = "arrow 10", desc = "Move cursor down 10 files" },
	{ on = "K", run = "arrow -10", desc = "Move cursor up 10 files" },

	{ on = "<C-j>", run = "seek 5", desc = "Seek down 5 units in the preview" },
	{ on = "<C-k>", run = "seek -5", desc = "Seek up 5 units in the preview" },

	{ on = "<Tab>", run = "tab_switch 1 --relative", desc = "Switch to next tab" },
	{ on = "<S-Tab>", run = "tab_switch -1 --relative", desc = "Switch to previous tab" },
]
