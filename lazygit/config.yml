os:
  editPreset: nvim
promptToReturnFromSubprocess: false
gui:
  scrollHeight: 10
  theme:
    activeBorderColor: [blue, bold]
    searchingActiveBorderColor: [blue, bold]
  darkTheme:
    inactiveBorderColor: ['#999999']
    selectedLineBgColor: ['#3A3A3A']
    inactiveViewSelectedLineBgColor: ['#2D2D2D']
  lightTheme:
    inactiveBorderColor: ['#636363']
    selectedLineBgColor: ['#D3D3D3']
    inactiveViewSelectedLineBgColor: ['#E3E3E3']
git:
  diffRenderers:
    - command: delta --{{colorScheme}} --features=workspace-{{colorScheme}} --paging=never
keybinding:
  universal:
    # vim-style fast jumps, mirrors nvim HJKL
    prevPage: 'K'
    nextPage: 'J'
    prevBlock-alt2: 'H'
    nextBlock-alt2: 'L'
    # free H/L from horizontal scroll
    scrollLeft: ''
    scrollRight: ''
