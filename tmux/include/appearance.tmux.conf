set -s dark-theme-black "#1E1E1E"
set -s dark-theme-blue "#75A9D6"
set -s dark-theme-cyan "#75A9D6"
set -s dark-theme-dark-grey "#252525"
set -s dark-theme-green "#8EBB8A"
set -s dark-theme-light-grey "#999999"
set -s dark-theme-red "#E08585"
set -s dark-theme-white "#D4D4D4"
set -s dark-theme-yellow "#CCB482"
set -s dark-theme-magenta "#C586C0"

set -s light-theme-black "#F5F5F5"
set -s light-theme-blue "#356C9B"
set -s light-theme-cyan "#356C9B"
set -s light-theme-dark-grey "#EBEBEB"
set -s light-theme-green "#427542"
set -s light-theme-light-grey "#636363"
set -s light-theme-red "#B34343"
set -s light-theme-white "#303030"
set -s light-theme-yellow "#806216"
set -s light-theme-magenta "#AF00DB"

set -s theme detect
set -g status-position bottom
set -g status-style 'bg=themedarkgrey,fg=themelightgrey'
set -g status-left-length 40
set -g status-right-length 80
set -g status-left ' #S │ '
set -g status-right '#{b:pane_current_path}  %H:%M '
set -w -g automatic-rename on
set -w -g automatic-rename-format '#{b:pane_current_path}'
set -g window-status-style 'fg=themelightgrey,bg=themedarkgrey'
set -g window-status-current-style 'fg=themewhite,bg=themeblack,bold'
set -g window-status-separator ' '
set -g window-status-format ' #I #W '
set -g window-status-current-format '#[fg=themeblue] #I #[fg=themewhite]#W '
set -g pane-border-style 'fg=themedarkgrey'
set -g pane-active-border-style 'fg=themelightgrey'
set -g pane-border-lines heavy
set -g mode-style 'bg=themelightgrey,fg=themeblack'
set -g message-style 'bg=themedarkgrey,fg=themewhite,fill=themedarkgrey'
set -g message-command-style 'bg=themedarkgrey,fg=themewhite,fill=themedarkgrey'
set -g display-panes-colour themelightgrey
set -g display-panes-active-colour themeblue
set -g popup-style 'bg=themeblack,fg=themewhite'
set -g popup-border-style 'bg=themeblack,fg=themelightgrey'
set -g popup-border-lines heavy
