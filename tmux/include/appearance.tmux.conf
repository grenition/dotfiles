# Status line and window/pane styles.
set -sq theme detect
set -g status-position bottom
set -g status-style 'bg=default,fg=default'
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#[fg=brightcyan,bold] #S #[default]'
set -g status-right '#[fg=white]#{b:pane_current_path}  %H:%M '
set -w -g automatic-rename on
set -w -g automatic-rename-format '#{b:pane_current_path}'
set -g window-status-style 'fg=white,bg=black'
set -g window-status-current-style 'default'
set -g window-status-separator ' '
set -g window-status-format ' #I #W '
set -g window-status-current-format '#[fg=brightcyan,bg=default,reverse] #I #[noreverse,fg=white,bg=black] #W '
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=cyan'
set -g pane-border-lines double
set -gq popup-style 'bg=default,fg=default'
set -gq popup-border-style 'bg=default,fg=cyan'
set -gq popup-border-lines rounded
