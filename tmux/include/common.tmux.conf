# Core terminal, editor, mouse and window-numbering settings.
unbind-key -a

# Terminal and editor support.
set -g default-terminal 'tmux-256color'
set -s escape-time 10
set -g focus-events on
set -g allow-passthrough on

# Mouse, scrollback and vi copy mode.
set -g mouse on
set -g history-limit 50000
set -w -g mode-keys vi
set-hook -g after-copy-mode 'send-keys -X rectangle-on'

# Number windows and panes from 1; close gaps after removing windows.
set -g base-index 1
set -w -g pane-base-index 1
set -g renumber-windows on

set -g repeat-time 1000
