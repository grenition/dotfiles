# Core terminal, editor, mouse and window-numbering settings.
unbind-key -a

# Terminal and editor support.
set -g default-terminal 'tmux-256color'
set -s escape-time 10
set -g focus-events on
set -g allow-passthrough on

# Mouse, scrollback and vi copy mode.
set -g mouse on
set -g history-limit 50000
set -w -g mode-keys vi
set-hook -g after-copy-mode 'send-keys -X rectangle-on'

# Number windows and panes from 1; close gaps after removing windows.
set -g base-index 1
set -w -g pane-base-index 1
set -g renumber-windows on

set -g repeat-time 1000

# popup-run <size> [shell-command]; the command receives TMUX_POPUP_THEME.
# `|| true` swallows the popup's exit status: without it run-shell reports
# every non-zero exit (`... returned 127`) when the popup closes.
set -s command-alias[popup-run] 'popup-run=run-shell "tmux -S #{q:socket_path} display-popup -E -c #{q:client_name} -d #{q:pane_current_path} -w #{q:1} -h #{q:1} -e TMUX_POPUP_THEME=#{?#{==:#{client_theme},light},light,dark} #{q:2} || true"'

# session-tree opens the session list; shortcut keys count from 1, 0 picks the tenth.
set -s command-alias[session-tree] 'session-tree=choose-tree -Zs -K "#{?#{e|<:#{line},10},#{e|m:#{e|+:1,#{line}},10},#{e|<:#{line},36},M-#{a:#{e|+:97,#{e|-:#{line},10}}}}"'
