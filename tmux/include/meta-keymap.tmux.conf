# Optional host shortcuts without the prefix.

# Windows: movement
bind -n 'M-Tab' next-window
bind -n 'M-BTab' previous-window
bind -n 'M-1' select-window -t 1
bind -n 'M-2' select-window -t 2
bind -n 'M-3' select-window -t 3
bind -n 'M-4' select-window -t 4
bind -n 'M-5' select-window -t 5
bind -n 'M-6' select-window -t 6
bind -n 'M-7' select-window -t 7
bind -n 'M-8' select-window -t 8
bind -n 'M-9' select-window -t 9
bind -n 'M-0' select-window -t 10
bind -n 'M-{' swap-window -d -t -1
bind -n 'M-}' swap-window -d -t +1

# Sessions: s opens the session tree, o toggles to the last one.
bind -n 'M-s' session-tree
bind -n 'M-o' switch-client -l

bind -n 'M-|' split-window -h -c '#{pane_current_path}'
bind -n 'M--' split-window -v -c '#{pane_current_path}'

# Panes: select in each direction. The -F format test resolves
# pane_current_command without spawning a shell on every keypress.
is_vim='#{||:#{==:#{pane_current_command},nvim},#{==:#{pane_current_command},vim}}'

bind -n M-h if-shell -F "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell -F "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell -F "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell -F "$is_vim" 'send-keys M-l' 'select-pane -R'

# Navigation in copy mode
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# Resize by 5 cells, matching prefix+H/J/K/L.
bind -n 'M-H' resize-pane -L 5
bind -n 'M-J' resize-pane -D 5
bind -n 'M-K' resize-pane -U 5
bind -n 'M-L' resize-pane -R 5

# Zoom the active pane, matching prefix+z.
bind -n 'M-z' resize-pane -Z

# Floating shell, editor and lazygit, also available through prefix+p, prefix+g, prefix+d and prefix+e.
bind -n 'M-p' popup-run 80%
bind -n 'M-g' popup-run 90% 'lazygit --use-config-file "$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/$TMUX_POPUP_THEME.yml"'
bind -n 'M-d' popup-run 90% lazydocker
bind -n 'M-e' popup-run 90% '${EDITOR:-nvim}'

bind -n 'M-v' copy-mode
bind -n 'M-]' paste-buffer -p

