# Optional host shortcuts without the prefix.

# Windows: movement
bind -n 'M-Tab' next-window
bind -n 'M-BTab' previous-window
bind -n 'M-1' select-window -t 1
bind -n 'M-2' select-window -t 2
bind -n 'M-3' select-window -t 3
bind -n 'M-4' select-window -t 4
bind -n 'M-5' select-window -t 5
bind -n 'M-6' select-window -t 6
bind -n 'M-7' select-window -t 7
bind -n 'M-8' select-window -t 8
bind -n 'M-9' select-window -t 9
bind -n 'M-0' select-window -t 10
bind -n 'M-{' swap-window -d -t -1
bind -n 'M-}' swap-window -d -t +1

bind -n 'M-|' split-window -h -c '#{pane_current_path}'
bind -n 'M--' split-window -v -c '#{pane_current_path}'

# Panes: select in each direction.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

bind -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

# Navigation in copy mode
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# Resize by 5 cells, matching prefix+H/J/K/L.
bind -n 'M-H' resize-pane -L 5
bind -n 'M-J' resize-pane -D 5
bind -n 'M-K' resize-pane -U 5
bind -n 'M-L' resize-pane -R 5

# Floating shell and lazygit, also available through prefix+p and prefix+g.
bind -n 'M-p' display-popup -E -w 80% -h 80% -d '#{pane_current_path}'
bind -n 'M-g' display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazygit
bind -n 'M-d' display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazydocker

bind -n 'M-v' copy-mode
bind -n 'M-]' paste-buffer -p

