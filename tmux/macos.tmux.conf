# macOS master config.
source-file ~/.config/tmux/include/common.tmux.conf
source-file ~/.config/tmux/include/keymap.tmux.conf
source-file ~/.config/tmux/include/meta-keymap.tmux.conf
source-file ~/.config/tmux/include/appearance.tmux.conf

# Ghostty terminal; macOS clipboard.
set -as terminal-features ',xterm-ghostty:RGB'
set -s set-clipboard external
set -s copy-command 'pbcopy'

# Prefix key.
set -g prefix M-Space
bind M-Space send-prefix

# Plugins.
source-file ~/.config/tmux/include/plugins.tmux.conf
