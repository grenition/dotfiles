unbind-key -a

set -g prefix C-a
set -g prefix2 None
set -g repeat-time 1000
bind C-a send-prefix

set -g default-terminal 'tmux-256color'
set -as terminal-features ',tmux*:RGB:clipboard'
set -s escape-time 10
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -wg mode-keys vi
set -s set-clipboard on
set -s copy-command ''

set -g base-index 1
set -wg pane-base-index 1
set -g renumber-windows on

set -sq theme detect
set -g status-position bottom
set -g status-style 'bg=default,fg=default'
set -g status-left-length 60
set -g status-right-length 80
set -g status-left '#[fg=brightgreen,bold] #h: #S #[default]'
set -g status-right '#[fg=white]#{b:pane_current_path}  %H:%M '
set -g window-status-style 'fg=white,bg=black'
set -g window-status-current-style 'default'
set -g window-status-separator ' '
set -g window-status-format ' #I #W '
set -g window-status-current-format '#[fg=brightgreen,bg=default,reverse] #I #[noreverse,fg=white,bg=black] #W '
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=green'
set -g pane-border-lines double
set -gq popup-style 'bg=default,fg=default'
set -gq popup-border-style 'bg=default,fg=green'
set -gq popup-border-lines rounded

source-file ~/.config/tmux/keymap.conf
