unbind-key -a

# Terminal and editor support.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB'
set -s escape-time 10
set -g focus-events on
set -g allow-passthrough on

# Mouse, scrollback and macOS clipboard.
set -g mouse on
set -g history-limit 50000
set -w -g mode-keys vi
set-hook -g after-copy-mode 'send-keys -X rectangle-on'
set -s set-clipboard external
set -s copy-command 'pbcopy'

# Number windows and panes from 1; close gaps after removing windows.
set -g base-index 1
set -w -g pane-base-index 1
set -g renumber-windows on

# Status
set -s theme detect
set -g status-position bottom
set -g status-style 'bg=default,fg=default'
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#[fg=brightcyan,bold] #S #[default]'
set -g status-right '#[fg=white]#{b:pane_current_path}  %H:%M '
set -w -g automatic-rename on
set -w -g automatic-rename-format '#{b:pane_current_path}'
set -g window-status-style 'fg=white,bg=black'
set -g window-status-current-style 'default'
set -g window-status-separator ' '
set -g window-status-format ' #I #W '
set -g window-status-current-format '#[fg=brightcyan,bg=default,reverse] #I #[noreverse,fg=white,bg=black] #W '
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=cyan'
set -g pane-border-lines double
set -g popup-style 'bg=default,fg=default'
set -g popup-border-style 'bg=default,fg=cyan'
set -g popup-border-lines rounded 

# Prefix key.
set -g prefix M-Space
set -g repeat-time 1000
bind M-Space send-prefix

# Keymaps; enable Meta shortcuts on hosts that need them.
source-file ~/.config/tmux/keymap.conf
source-file ~/.config/tmux/meta.keymap.conf

# Plugins
source-file ~/.config/tmux/plugins.conf
