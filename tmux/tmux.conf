unbind-key -a

# Terminal and editor support.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB,wezterm:RGB'
set -s escape-time 10
set -g focus-events on

# Mouse, scrollback and macOS clipboard.
set -g mouse on
set -g history-limit 50000
set -w -g mode-keys vi
set -s set-clipboard external
set -s copy-command 'pbcopy'

# Number windows and panes from 1; close gaps after removing windows.
set -g base-index 1
set -w -g pane-base-index 1
set -g renumber-windows on
set -g status-left '#S '
set -g status-right '%H:%M'

# Status
set -g status-position bottom

# Prefix key.
set -g prefix M-Space
set -g repeat-time 1000
bind M-Space send-prefix

# Keymaps; enable Meta shortcuts on hosts that need them.
source-file ~/.config/tmux/keymap.conf
source-file ~/.config/tmux/meta.keymap.conf
