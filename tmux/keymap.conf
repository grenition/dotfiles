# Windows: movement
bind Tab next-window
bind BTab previous-window
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind 0 select-window -t 10
bind -r S-Left swap-window -d -t 0
bind -r S-Right swap-window -d -t +1

# Windows: editing
bind c new-window -c '#{pane_current_path}'
bind , command-prompt -I '#W' { rename-window '%%' }

# Shell and lazygit popups in the current directory.
bind p display-popup -E -w 80% -h 80% -d '#{pane_current_path}'
bind g display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazygit

# Split: | puts the new pane on the right; - puts it below.
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Move between panes with h/j/k/l.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r Left swap-pane -d -t '{left-of}'
bind -r Down swap-pane -d -t '{down-of}'
bind -r Up swap-pane -d -t '{up-of}'
bind -r Right swap-pane -d -t '{right-of}'

# Resize by 5 cells; repeat H/J/K/L without pressing the prefix again.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Zoom, cycle layouts, move a pane into its own window, close with confirmation.
bind z resize-pane -Z
bind Space next-layout
bind ! break-pane
bind @ command-prompt -F -p 'Join pane into window:' 'join-pane -h -s "#{pane_id}" -t ":%%"'
bind x kill-pane

# Sessions: choose or detach (keep processes running).
bind s choose-tree -Zs
bind $ command-prompt -I '#S' { rename-session '%%' }
bind d detach-client

# Copy: [ enters history; / searches; n/N repeat search; q/Escape exit.
# In copy mode: v starts selection, r toggles rectangle, y/Enter copies.
# ] pastes the tmux buffer; Cmd-v pastes the macOS clipboard in WezTerm.
bind [ copy-mode
bind ] paste-buffer -p
bind -T copy-mode-vi H send-keys -X -N 20 cursor-left
bind -T copy-mode-vi J send-keys -X -N 10 cursor-down
bind -T copy-mode-vi K send-keys -X -N 10 cursor-up
bind -T copy-mode-vi L send-keys -X -N 20 cursor-right
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi r send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# Command prompt and configuration reload.
bind : command-prompt
bind r source-file ~/.tmux.conf \; display-message 'Config reloaded'
