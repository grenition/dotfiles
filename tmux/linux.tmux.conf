# Remote Linux hosts master config.
source-file ~/.config/tmux/include/common.tmux.conf
source-file ~/.config/tmux/include/keymap.tmux.conf
source-file ~/.config/tmux/include/appearance.tmux.conf

# Nested sessions over ssh: screen-style prefix, OSC 52 clipboard.
set -as terminal-features ',tmux*:RGB:clipboard'
set -s set-clipboard on
set -s copy-command ''
set -g prefix C-a
set -g prefix2 None
bind C-a send-prefix

# Remote sessions: green accent and host prefix in status.
set -g status-left-length 60
set -g status-left '#[fg=brightgreen,bold] #h: #S #[default]'
set -g window-status-current-format '#[fg=brightgreen,bg=default,reverse] #I #[noreverse,fg=white,bg=black] #W '
set -g pane-active-border-style 'fg=green'
set -gq popup-border-style 'bg=default,fg=green'
