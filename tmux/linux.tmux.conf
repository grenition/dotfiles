# Remote Linux hosts master config.
source-file ~/.config/tmux/include/common.tmux.conf
source-file ~/.config/tmux/include/keymap.tmux.conf
source-file ~/.config/tmux/include/appearance.tmux.conf

# Nested sessions over ssh: screen-style prefix, OSC 52 clipboard.
set -as terminal-features ',tmux*:RGB:clipboard'
set -s set-clipboard on
set -s copy-command ''
set -g prefix C-a
set -g prefix2 None
bind C-a send-prefix

# Remote sessions: accent (the themecyan slot) is green; host prefix in status.
set -s dark-theme-cyan "#8EBB8A"
set -s light-theme-cyan "#427542"
set -g status-left-length 60
set -g status-left '#[fg=themecyan,bold] #h: #S #[default]'
