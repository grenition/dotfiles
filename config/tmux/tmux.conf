# Vim-like tmux defaults.

set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"
set -s extended-keys on
# Give Terminal enough time to combine Escape with multibyte Meta keys.
set -g escape-time 20
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off
set -g allow-passthrough on

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
setw -g mode-keys vi

# Prefix works with both English and Russian keyboard layouts.
unbind C-b
set -g prefix C-b
set -g prefix2 C-и

# Refresh tmux config
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind к source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Splits in the current directory.
bind v split-window -h -c "#{pane_current_path}"
bind м split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x kill-pane
bind ч kill-pane

# Resize panes with the same H/J/K/L bias as the Vim config.
bind -r H resize-pane -L 10
bind -r Р resize-pane -L 10
bind -r J resize-pane -D 5
bind -r О resize-pane -D 5
bind -r K resize-pane -U 5
bind -r Л resize-pane -U 5
bind -r L resize-pane -R 10
bind -r Д resize-pane -R 10
bind = select-layout tiled
bind -r m resize-pane -Z
bind -r ь resize-pane -Z

# Windows: direct navigation and lifecycle shortcuts.
bind -n 'M-Tab' select-window -t:+
bind -n 'M-BTab' select-window -t:-
bind -n 'M-t' new-window -c "#{pane_current_path}"
bind -n 'M-е' new-window -c "#{pane_current_path}"
bind -n 'M-w' if-shell '/bin/zsh "$(dirname "$(readlink "$HOME/.tmux.conf")")/scripts/window-has-active-process.zsh" "#{q:window_id}"' { command-prompt -p "Kill window #W with active processes? (y/n)" { run-shell '/bin/zsh "$(dirname "$(readlink "$HOME/.tmux.conf")")/scripts/confirm-window-close.zsh" "%%" "#{q:window_id}"' } } { kill-window }
bind -n 'M-ц' if-shell '/bin/zsh "$(dirname "$(readlink "$HOME/.tmux.conf")")/scripts/window-has-active-process.zsh" "#{q:window_id}"' { command-prompt -p "Kill window #W with active processes? (y/n)" { run-shell '/bin/zsh "$(dirname "$(readlink "$HOME/.tmux.conf")")/scripts/confirm-window-close.zsh" "%%" "#{q:window_id}"' } } { kill-window }
bind c new-window -c "#{pane_current_path}"
bind с new-window -c "#{pane_current_path}"

# Panes
bind -n 'M-h' select-pane -L
bind -n 'M-р' select-pane -L
bind -n 'M-j' select-pane -D
bind -n 'M-о' select-pane -D
bind -n 'M-k' select-pane -U
bind -n 'M-л' select-pane -U
bind -n 'M-l' select-pane -R
bind -n 'M-д' select-pane -R

# Russian aliases for tmux's built-in prefix shortcuts.
bind Э split-window
bind э command-prompt -T window-target -p index { select-window -t ":%%" }
bind б command-prompt -I "#W" { rename-window "%%" }
bind ю command-prompt -T target { move-window -t "%%" }
bind Ж command-prompt
bind ж last-pane
bind Х swap-pane -U
bind Ъ swap-pane -D
bind Ё show-messages
bind С customize-mode -Z
bind В choose-client -Z
bind У select-layout -E
bind Ь select-pane -M
bind ъ paste-buffer -p
bind в detach-client
bind а command-prompt { find-window -Z "%%" }
bind ш display-message
bind д last-window
bind т next-window
bind щ select-pane -t :.+
bind й display-panes
bind ы choose-tree -Zs
bind е clock-mode
bind ц choose-tree -Zw
bind я resize-pane -Z
bind 'M-т' next-window -a
bind 'M-щ' rotate-window -D
bind 'M-з' previous-window -a
bind 'C-щ' rotate-window
bind 'C-я' suspend-client

# Popup shell in the current directory.
bind p display-popup -E -w 80% -h 80% -d "#{pane_current_path}" 'tmux_config="$(readlink "$HOME/.tmux.conf")"; ZDOTDIR="$(dirname "$tmux_config")/popup-zsh" exec /bin/zsh -i'
bind з display-popup -E -w 80% -h 80% -d "#{pane_current_path}" 'tmux_config="$(readlink "$HOME/.tmux.conf")"; ZDOTDIR="$(dirname "$tmux_config")/popup-zsh" exec /bin/zsh -i'
bind -n 'M-p' display-popup -E -w 80% -h 80% -d "#{pane_current_path}" 'tmux_config="$(readlink "$HOME/.tmux.conf")"; ZDOTDIR="$(dirname "$tmux_config")/popup-zsh" exec /bin/zsh -i'
bind -n 'M-з' display-popup -E -w 80% -h 80% -d "#{pane_current_path}" 'tmux_config="$(readlink "$HOME/.tmux.conf")"; ZDOTDIR="$(dirname "$tmux_config")/popup-zsh" exec /bin/zsh -i'

# Copy mode: vi selection keys, y copies and exits.
bind [ copy-mode
bind х copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi м send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi C-м send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi н send -X copy-selection-and-cancel
if-shell -b 'command -v pbcopy >/dev/null 2>&1' 'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'
if-shell -b 'command -v pbcopy >/dev/null 2>&1' 'bind -T copy-mode-vi н send -X copy-pipe-and-cancel "pbcopy"'
bind P paste-buffer
bind З paste-buffer
unbind -T copy-mode-vi MouseDragEnd1Pane

# Russian aliases for the built-in vi copy-mode keys.
bind -T copy-mode-vi . command-prompt -T search -p "(search down)" { send -X search-forward -- "%%" }
bind -T copy-mode-vi б send -X jump-reverse
bind -T copy-mode-vi Ж command-prompt -p "(goto line)" { send -X goto-line -- "%%" }
bind -T copy-mode-vi ж send -X jump-again
bind -T copy-mode-vi Х send -X previous-paragraph
bind -T copy-mode-vi Ъ send -X next-paragraph
bind -T copy-mode-vi Ф send -X append-selection-and-cancel
bind -T copy-mode-vi И send -X previous-space
bind -T copy-mode-vi В send -X copy-pipe-end-of-line-and-cancel
bind -T copy-mode-vi У send -X next-space-end
bind -T copy-mode-vi А command-prompt -1 -p "(jump backward)" { send -X jump-backward -- "%%" }
bind -T copy-mode-vi П send -X history-bottom
bind -T copy-mode-vi Р send -X top-line
bind -T copy-mode-vi О send -X scroll-down
bind -T copy-mode-vi Л send -X scroll-up
bind -T copy-mode-vi Д send -X bottom-line
bind -T copy-mode-vi Ь send -X middle-line
bind -T copy-mode-vi Т send -X search-reverse
bind -T copy-mode-vi З send -X toggle-position
bind -T copy-mode-vi Е command-prompt -1 -p "(jump to backward)" { send -X jump-to-backward -- "%%" }
bind -T copy-mode-vi М send -X select-line
bind -T copy-mode-vi Ц send -X next-space
bind -T copy-mode-vi Ч send -X set-mark
bind -T copy-mode-vi и send -X previous-word
bind -T copy-mode-vi у send -X next-word-end
bind -T copy-mode-vi а command-prompt -1 -p "(jump forward)" { send -X jump-forward -- "%%" }
bind -T copy-mode-vi п send -X history-top
bind -T copy-mode-vi р send -X cursor-left
bind -T copy-mode-vi о send -X cursor-down
bind -T copy-mode-vi л send -X cursor-up
bind -T copy-mode-vi д send -X cursor-right
bind -T copy-mode-vi т send -X search-again
bind -T copy-mode-vi щ send -X other-end
bind -T copy-mode-vi й send -X cancel
bind -T copy-mode-vi к send -X refresh-from-pane
bind -T copy-mode-vi е command-prompt -1 -p "(jump to forward)" { send -X jump-to-forward -- "%%" }
bind -T copy-mode-vi ц send -X next-word
bind -T copy-mode-vi я send -X scroll-middle
bind -T copy-mode-vi 'M-ч' send -X jump-to-mark
bind -T copy-mode-vi 'C-х' send -X clear-selection
bind -T copy-mode-vi 'C-и' send -X page-up
bind -T copy-mode-vi 'C-с' send -X cancel
bind -T copy-mode-vi 'C-в' send -X halfpage-down
bind -T copy-mode-vi 'C-у' send -X scroll-down
bind -T copy-mode-vi 'C-а' send -X page-down
bind -T copy-mode-vi 'C-р' send -X cursor-left
bind -T copy-mode-vi 'C-о' send -X copy-pipe-and-cancel
bind -T copy-mode-vi 'C-г' send -X halfpage-up
bind -T copy-mode-vi 'C-н' send -X scroll-up

# Minimal status line.
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=colour117,bold] #S #[fg=colour245]#I:#P "
set -g status-right "#[fg=colour245]%Y-%m-%d #[fg=colour117]%H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour235,bg=colour117,bold] #I:#W "
setw -g window-status-separator ""
setw -g pane-border-style "fg=colour238"
setw -g pane-active-border-style "fg=colour117"
