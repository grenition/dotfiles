# Vim-like tmux defaults.

set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
# Advertise true colour and hyperlinks without overriding other capabilities.
set -as terminal-features ",xterm*:RGB:hyperlinks"
set -s extended-keys on
# Give Terminal enough time to combine Escape with multibyte Meta keys.
set -g escape-time 20
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off
set -g allow-passthrough on

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
setw -g mode-keys vi

# Prefix key.
unbind C-b
set -g prefix C-b
set -g prefix2 M-Space

# Refresh tmux config
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Splits in the current directory.
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind x kill-pane

# Resize panes with the same H/J/K/L bias as the Vim config.
bind -r H resize-pane -L 10
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 10
bind = select-layout tiled
bind -r m resize-pane -Z

# Windows: direct navigation and lifecycle shortcuts.
bind -n 'M-Tab' select-window -t:+
bind -n 'M-BTab' select-window -t:-
bind -n 'M-t' new-window -c "#{pane_current_path}"
bind -n 'M-w' if-shell '/bin/zsh "$(dirname "$(readlink "$HOME/.tmux.conf")")/scripts/window-has-active-process.zsh" "#{q:window_id}"' { command-prompt -p "Kill window #W with active processes? (y/n)" { run-shell '/bin/zsh "$(dirname "$(readlink "$HOME/.tmux.conf")")/scripts/confirm-window-close.zsh" "%%" "#{q:window_id}"' } } { kill-window }
bind c new-window -c "#{pane_current_path}"

# Panes
bind -n 'M-h' select-pane -L
bind -n 'M-j' select-pane -D
bind -n 'M-k' select-pane -U
bind -n 'M-l' select-pane -R

# Floating shell pane in the current directory.
bind p if-shell -F '#{window_zoomed_flag}' { resize-pane -Z } \; new-pane -x 80% -y 80% -X 10% -Y 10% -c "#{pane_current_path}" 'tmux_config="$(readlink "$HOME/.tmux.conf")"; ZDOTDIR="$(dirname "$tmux_config")/popup-zsh" exec /bin/zsh -i'
bind -n 'M-p' if-shell -F '#{window_zoomed_flag}' { resize-pane -Z } \; new-pane -x 80% -y 80% -X 10% -Y 10% -c "#{pane_current_path}" 'tmux_config="$(readlink "$HOME/.tmux.conf")"; ZDOTDIR="$(dirname "$tmux_config")/popup-zsh" exec /bin/zsh -i'

# Copy mode: vi selection keys, y copies and exits.
bind -n 'M-v' copy-mode
# Keep macOS Option navigation/editing keys available to the shell.
unbind -n 'M-b'
unbind -n 'M-f'
unbind -n 'M-Up'
unbind -n 'M-Down'
unbind -n 'M-Left'
unbind -n 'M-Right'
unbind -n 'M-BSpace'
bind [ copy-mode
bind -r -T copy-mode-vi H send -X -N 20 cursor-left
bind -r -T copy-mode-vi J send -X -N 10 cursor-down
bind -r -T copy-mode-vi K send -X -N 10 cursor-up
bind -r -T copy-mode-vi L send -X -N 20 cursor-right
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape if-shell -F '#{selection_active}' { send -X clear-selection } { send -X cancel }
bind -T copy-mode-vi y send -X copy-selection-and-cancel
if-shell -b 'command -v pbcopy >/dev/null 2>&1' 'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'
bind P paste-buffer
unbind -T copy-mode-vi MouseDragEnd1Pane

# Open the URL under the copy-mode cursor with gd. Keep gg as the usual jump
# to the top of history.
bind -T copy-mode-vi g switch-client -T copy-mode-vi-g
bind -T copy-mode-vi-g g send -X history-top
bind -T copy-mode-vi-g d if-shell '/bin/zsh "$(dirname "$(readlink "$HOME/.tmux.conf")")/scripts/open-url.zsh" "#{q:copy_cursor_hyperlink}" "#{q:copy_cursor_line}" "#{copy_cursor_x}"' { send -X cancel } { display-message "No URL under cursor" }

# Open links on mouse release so dragging can still start a selection.
bind -n MouseUp1Pane if-shell '/bin/zsh "$(dirname "$(readlink "$HOME/.tmux.conf")")/scripts/open-url.zsh" "#{q:mouse_hyperlink}" "#{q:mouse_line}" "#{mouse_x}"' {} { send-keys -M }
bind -T copy-mode-vi MouseUp1Pane if-shell '/bin/zsh "$(dirname "$(readlink "$HOME/.tmux.conf")")/scripts/open-url.zsh" "#{q:mouse_hyperlink}" "#{q:mouse_line}" "#{mouse_x}"' { send -X cancel } {}

# Flat status line that follows the terminal's ANSI palette.
set -g status-position bottom
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=default,fg=default"
set -g status-left-length 30
set -g status-right-length 90
set -g status-left "#[fg=colour6,bg=default,bold] #S #[default]"
set -g status-right "#{?client_prefix,#[fg=colour6]PREFIX #[default],}#{?window_zoomed_flag,#[fg=colour6]ZOOM #[default],}#{?pane_in_mode,#[fg=colour6]COPY #[default],}#{?synchronize-panes,#[fg=colour6]SYNC #[default],}#[fg=colour8]#H #[fg=default]%H:%M "

setw -g window-status-separator ""
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-style "fg=colour8,bg=default"
setw -g window-status-current-style "fg=colour0,bg=colour6,bold"
setw -g window-status-activity-style "fg=colour3,bg=default,bold"
setw -g window-status-bell-style "fg=colour1,bg=default,bold"

# Keep panes, prompts, and copy mode on the same ANSI palette.
setw -g pane-border-style "fg=colour8"
setw -g pane-active-border-style "fg=colour6"
set -g pane-border-indicators colour
set -g display-panes-colour colour8
set -g display-panes-active-colour colour6
# Keep both command-prompt input modes opaque and readable on light and dark
# terminal themes. The command-mode style must not fall back to a transparent
# background, otherwise the old status contents show through.
set -g message-style "fg=colour0,bg=colour6,bold"
set -g message-command-style "fg=colour0,bg=colour6,bold"
# tmux 3.7 styles only the message cells by default; fill the remaining row so
# stale window-list and status-right cells cannot show through the prompt.
set -g message-format "#[fill=colour6]#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#{message}"
set -g menu-style "fg=default,bg=default"
set -g menu-selected-style "fg=colour0,bg=colour6,bold"
set -g menu-border-style "fg=colour8"
setw -g mode-style "fg=colour0,bg=colour6,bold"
setw -g copy-mode-match-style "fg=colour0,bg=colour3"
setw -g copy-mode-current-match-style "fg=colour0,bg=colour6,bold"
setw -g copy-mode-mark-style "fg=colour0,bg=colour3"
setw -g clock-mode-colour colour6
